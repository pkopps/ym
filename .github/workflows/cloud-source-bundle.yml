name: Cloud source bundle

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle:
    if: github.head_ref == 'codex/cloud-post-merge-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-source-bundle
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
