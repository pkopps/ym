name: Scheduled operations
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
concurrency:
  group: yardmatch-scheduled-operations
  cancel-in-progress: false
jobs:
  sweeps:
    if: vars.OPS_AUTOMATION_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: operations
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run authenticated, audited sweeps
        run: node scripts/run-ops-automation.mjs
        env:
          API_BASE_URL: ${{ vars.OPS_API_BASE_URL }}
          OPS_AUTOMATION_TOKEN: ${{ secrets.OPS_AUTOMATION_TOKEN }}
          OPS_AUTOMATION_EXECUTE: '1'
      - name: Verify run freshness and collection health
        run: node scripts/check-ops-health.mjs
        env:
          API_BASE_URL: ${{ vars.OPS_API_BASE_URL }}
          OPS_AUTOMATION_TOKEN: ${{ secrets.OPS_AUTOMATION_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-automation-${{ github.run_id }}
          path: reports/ci/ops-automation/
          retention-days: 30
