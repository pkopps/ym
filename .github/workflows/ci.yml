name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Lint, typecheck, and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify mobile release configuration
        run: npm run verify:mobile-release

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: API tests
        run: npm run test:api

      - name: API smoke
        run: npm run test:api:smoke

  postgres-integration:
    name: Postgres migrations and repository integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yardmatch
          POSTGRES_PASSWORD: yardmatch_test
          POSTGRES_DB: yardmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yardmatch -d yardmatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Prepare archived verification evidence
        run: mkdir -p reports/ci/postgres-integration

      - name: Apply migrations to isolated test database
        run: npm run prisma:deploy 2>&1 | tee reports/ci/postgres-integration/migrate-deploy.log
        env:
          DATABASE_URL: postgresql://yardmatch:yardmatch_test@127.0.0.1:5432/yardmatch_test

      - name: Confirm migration history is current
        run: npx prisma migrate status --schema apps/api/prisma/schema.prisma 2>&1 | tee reports/ci/postgres-integration/migrate-status.log
        env:
          DATABASE_URL: postgresql://yardmatch:yardmatch_test@127.0.0.1:5432/yardmatch_test

      - name: Reject Prisma schema drift outside migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel apps/api/prisma/schema.prisma --exit-code 2>&1 | tee reports/ci/postgres-integration/schema-diff.log
        env:
          DATABASE_URL: postgresql://yardmatch:yardmatch_test@127.0.0.1:5432/yardmatch_test

      - name: Postgres repository integration tests
        run: npm run test:api:postgres 2>&1 | tee reports/ci/postgres-integration/repository-tests.log
        env:
          TEST_DATABASE_URL: postgresql://yardmatch:yardmatch_test@127.0.0.1:5432/yardmatch_test

      - name: Archive Postgres launch-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-launch-gate-${{ github.sha }}
          path: reports/ci/postgres-integration/
          if-no-files-found: error
          retention-days: 90

  web-smoke:
    name: Web smoke
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:web:smoke

  mobile-export:
    name: Mobile export (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-mobile
          - provider-mobile
          - crew-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web, iOS, and Android bundles
        run: npm run build:${{ matrix.app }}
        env:
          EXPO_PUBLIC_YARDMATCH_ENV: staging
          EXPO_PUBLIC_API_BASE_URL: https://api.staging.yardmatch.test

      - name: Archive mobile export metadata
        uses: actions/upload-artifact@v4
        with:
          name: mobile-export-${{ matrix.app }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/dist/metadata.json
          if-no-files-found: error
          retention-days: 30
