name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Typecheck and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: API tests
        run: npm run test:api

      - name: API smoke
        run: npm run test:api:smoke

  postgres-integration:
    name: Postgres migrations and repository integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yardmatch
          POSTGRES_PASSWORD: yardmatch_test
          POSTGRES_DB: yardmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yardmatch -d yardmatch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations to isolated test database
        run: npm run prisma:deploy
        env:
          DATABASE_URL: postgresql://yardmatch:yardmatch_test@127.0.0.1:5432/yardmatch_test

      - name: Postgres repository integration tests
        run: npm run test:api:postgres
        env:
          TEST_DATABASE_URL: postgresql://yardmatch:yardmatch_test@127.0.0.1:5432/yardmatch_test

  web-smoke:
    name: Web smoke
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run test:web:smoke
