services:
  - type: web
    name: yardmatch-staging-api
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build:api && npm run verify:production-config && npm run prisma:deploy && npm run prisma:seed
    startCommand: npm run start:api
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: YARDMATCH_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: yardmatch-staging-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: API_MAX_REQUEST_BODY_BYTES
        value: "2500000"
      - key: PHOTO_STORAGE_MODE
        value: vercel-blob-private
      - key: APP_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: STAGING_NOTIFICATION_ALLOWED_EMAILS
        sync: false
      - key: STAGING_NOTIFICATION_ALLOWED_SMS_NUMBERS
        sync: false
      - key: YARDMATCH_STAGING_SEED_PASSWORD
        sync: false

databases:
  - name: yardmatch-staging-db
    databaseName: yardmatch_staging
    user: yardmatch_staging
    region: virginia
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []
